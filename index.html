<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galería de Gatos</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script src="./posts.js"></script>
</head>
<body class="bg-[#0f172a] text-slate-200 min-h-screen p-6 md:p-10 font-sans">

  <div id="cuerpo"></div>

  <script type="text/babel">

    function PostCard({ post }) {
      return (
        <div className="bg-[#1e293b] border-2 border-slate-700/60 rounded-xl overflow-hidden flex flex-col shadow-lg hover:shadow-2xl transition-all duration-300">
          <img 
            src={post.image} 
            alt={post.title} 
            className="w-full h-60 object-cover block"
          />
          <div className="p-6 flex flex-col flex-grow">
            <h2 className="text-lg font-bold text-white mb-3 leading-snug">
              {post.title}
            </h2>
            <p className="text-sm font-medium text-green-400 mb-3 leading-relaxed">
              {post.description}
            </p>
            <p className="text-sm text-green-400 mb-6 leading-relaxed flex-grow">
              {post.content}
            </p>
            <span className="text-xs font-mono text-slate-400">
              {post.created_at}
            </span>
          </div>
        </div>
      );
    }

    function MyApp() {
      return (
        <main className="max-w-4xl mx-auto p-6">
          <h1 className="text-3xl md:text-4xl font-extrabold text-violet-500 text-center mb-8">
        Gallerie Gatos
          </h1>
          <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
            {postsData.map((post) => (
              <PostCard key={post.id} post={post} />
            ))}
          </div>
        </main>
      );
    }

    const container = document.getElementById('cuerpo');
    const cuerpo = ReactDOM.createRoot(container);
    cuerpo.render(<MyApp />);

  </script>
</body>
</html>
